{% extends 'layouts/base.html' %} {% block content %}

<h2>Tambah Kriteria</h2>
<hr />

<form method="POST">
  {% csrf_token %}

  <div class="mb-3">
    <label>Kode</label>
    {{ form.kode }}
  </div>

  <div class="mb-3">
    <label>Nama Kriteria</label>
    {{ form.nama }}
  </div>

  <div class="mb-3">
    <label>Bobot</label>
    {{ form.bobot }}
  </div>

  <div class="mb-3">
    <label>Jenis</label>
    {{ form.jenis }}
  </div>

  <button type="submit" class="btn btn-success">Simpan</button>

  <a href="/kriteria/" class="btn btn-secondary"> Kembali </a>
</form>

{% endblock %}
