{% extends 'layouts/base.html' %} {% block content %}

<div class="d-flex justify-content-between mb-3">
  <h2>Data Sub Kriteria</h2>

  <a href="/subkriteria/tambah/" class="btn btn-success"> + Tambah Sub Kriteria </a>
</div>

<table class="table table-bordered table-striped">
  <thead class="table-success">
    <tr>
      <th>No</th>
      <th>Kriteria</th>
      <th>Deskripsi</th>
      <th>Skor</th>
      <th width="180">Aksi</th>
    </tr>
  </thead>

  <tbody>
    {% for item in data %}

    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ item.kriteria.nama }}</td>
      <td>{{ item.deskripsi }}</td>
      <td>{{ item.skor }}</td>

      <td>
        <a href="{% url 'edit_subkriteria' item.id %}" class="btn btn-warning btn-sm"> Edit </a>

        <a href="{% url 'hapus_subkriteria' item.id %}" class="btn btn-danger btn-sm"> Hapus </a>
      </td>
    </tr>

    {% endfor %}
  </tbody>
</table>

{% endblock %}
